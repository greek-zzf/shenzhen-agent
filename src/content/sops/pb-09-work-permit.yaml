    slot: conflict
    why: A briefing describes B/C renewal age notes. Official FAQ is the window's document. We show both. We do not add an age workaround or a visa-run.
    skippable: true
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
    speech_card: null
    click_path: null
    official_urls:
      - label: China Briefing — 2026 age policy
        url: https://www.china-briefing.com/news/work-permit-renewal-shenzhen-age-policy-update/
