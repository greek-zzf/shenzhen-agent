      a substitute for the window.
    as_of: official-faq
- id: c-12345-english-hours
  title_en: 12345 English service hours are comment-level unknowns. Do not hardcode a schedule.
  resolution: verify_at_window
  sources:
  - label: spec §12.2 (未知)
    url: https://stic.sz.gov.cn/xxgk/ztzl/wzyw/wtjd/content/post_10419503.html
    kind: official
    claim_en: Use official FAQ / hotline pages; Reddit hour claims are not authoritative.
    as_of: unknown-live
  - label: Shenzhen foreigner service platform
    url: https://wgfw.ga.sz.gov.cn/user/wgrfwpt
    kind: official
    claim_en: Prefer official platforms and exit-entry windows over comment-level hotline hour claims.
      Hours remain verify-at-window.
    as_of: platform
failure_tree:
  id: pb-09-stuck
  title_en: I'm stuck
  nodes:
  - id: no_employer
    question_en: I do not have an employer filing for me?
    advice_en: This product does not sell work permits. Use licensed agencies only if you choose — we
      do not file.
    never:
    - buy_a_work_permit_
    next: missing_doc
    vpn_off_only: false
  - id: missing_doc
    question_en: A required personal document is missing?
    advice_en: Finish PB-02 stay registration if the slip is missing. Ask HR which exact item the live
      materials list wants.
    never: []
    next: delayed
    vpn_off_only: false
  - id: delayed
    question_en: It has been longer than HR expected?
    advice_en: Ask HR to check the employer portal status; bring SMS screenshots.
    never: []
    next: cancelled
    vpn_off_only: false
  - id: cancelled
    question_en: Permit cancelled after layoff?
    advice_en: Go to the local exit-entry window HR names; keep all termination papers.
    never:
    - fly_out_and_re_enter_on_a_tourist_path_as_the_pr
    next: null
    vpn_off_only: false
attached_playbooks:
- pb-02
- pb-10
- pb-06
