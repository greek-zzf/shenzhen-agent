    visa photo. Exact list is on the official materials page — live-fetch.'
  skippable: false
  skip_if: null
  passport_fail_warning: null
  getting_there: null
  what_to_bring:
  - id: passport-current-visa-stamp-pages
    label_en: Passport + current visa/stamp pages
    required: true
  - id: no-crime-certificate-as-required-for-you
    label_en: No-crime certificate (as required for your category)
    required: true
  - id: degree-diploma-authentication-pack
    label_en: Degree / diploma authentication pack
    required: true
  - id: medical-examination-report-from-an-accep
    label_en: Medical examination report from an accepted hospital
    required: true
  - id: slip
    label_en: 临时住宿登记 slip
    required: true
  - id: visa-photo-per-current-spec
    label_en: Visa photo per current spec
    required: true
