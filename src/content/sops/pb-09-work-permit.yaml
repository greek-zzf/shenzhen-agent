    title_en: No 挂靠 and no visa-run
    slot: required_check
    why: A permit tied to a shell employer, a purchased letter, or “fly out and come back” is not a product step. Official next step only.
    skippable: false
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
    speech_card: null
    click_path: null
    official_urls: []
    prefill: {}
    required_checkboxes:
      - id: no-guakao
        label_en: I will not use a 挂靠 / purchased permit / fake employer
      - id: no-visa-run
