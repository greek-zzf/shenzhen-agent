  - id: hr-speech
    title_en: What to send HR
    slot: speech
    why: A short status ask. No accusation. Attach the official URL and your real materials list.
    skippable: false
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
    speech_card:
      hanzi: 您好，工作许可和居留许可由公司提交。我已按官方清单准备个人材料，请查收。请把系统进度截图发给我。
      pinyin: Nín hǎo, gōngzuò xǔkě hé jūliú xǔkě yóu gōngsī tíjiāo. Wǒ yǐ àn guānfāng qīngdān zhǔnbèi gèrén cáiliào, qǐng cháshōu. Qǐng bǎ xìtǒng jìndù jiétú fā gěi wǒ.
      en: Hello. The company files the work and residence permits. I have prepared my personal materials against the official list. Please send a screenshot of the system status.
    click_path: null
    official_urls:
      - label: Shenzhen foreigners service platform
        url: https://wgfw.ga.sz.gov.cn/user/wgrfwpt
        kind: official
    prefill: {}
    required_checkboxes: []
    primary_cta:
      id: next_step
      label_en: Show HR
    stuck_node: hr-not-started
    timer: null
  - id: laid-off-official-only
    title_en: If the job ended — official next step only
    slot: required_check
    why: Cancellation is an HR + window process. We do not teach a visa-run. 12345 English hours are unverified — confirm when you call.
    skippable: true
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
    speech_card:
      hanzi: 请问许可取消后，我下一步应该去哪个出入境窗口？
      pinyin: Qǐngwèn xǔkě qǔxiāo hòu, wǒ xià yí bù yīnggāi qù nǎge chūrùjìng chuāngkǒu?
      en: After the permit is cancelled, which exit-entry window should I go to next?
    click_path: null
    official_urls:
