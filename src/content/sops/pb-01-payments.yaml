        - n: 1
          text_en: Open Alipay → Me → Bank cards → Add card. Enter the card as your bank has it. We never submit this form.
          screenshot: /copilot-stock/clickpath/alipay-bind-foreign-card-steps-2026.jpg
          note: Stock photo — confirm at the window. StartChinaTravel 2026-01 numbered foreign-card bind (Me → Bank Cards → Add Bank Card). Tour Card wind-down — this is direct bind, not Tour Card open/activate. chinafortravelers 2026 frames were not recovered (Cloudflare; no stable image URL). Rights not cleared. Not founder-verified.
        - n: 2
          text_en: Open WeChat → Me → Services → Wallet → Cards. Same rule — official app only.
          screenshot: null
        - n: 3
          text_en: If a bind fails, try the other app. Do not hand your passport to a stranger or a “helper” kiosk that is not the official one-stop desk.
