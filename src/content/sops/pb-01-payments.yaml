      title_en: Finish passport KYC before merchant mini-programs
      body_en: Do not open a shop or metro mini-program to “fix” an unbound wallet. Complete KYC and card bind in Alipay or WeChat first. We never submit on your behalf.
    getting_there: null
    what_to_bring: []
    speech_card: null
    click_path:
