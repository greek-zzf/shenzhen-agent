failure_tree:
  id: metro-stuck
  title_en: I'm stuck
  nodes:
    - id: miniprogram-fail
      question_en: The Shenzhen Metro mini-program will not issue a code?
      advice_en: Leave it. Open the Alipay app itself → Transport / 出行 → 乘车码. The mini-program is not the first hotspot.
      never: []
      next: vpn-off
      vpn_off_only: false
    - id: vpn-off
      question_en: Transport tab errors or the QR is grey?
      advice_en: Turn the VPN off and retry. VPN-off is the only network step. Then use the cash ticket machine.
      never: []
      next: cash-machine
      vpn_off_only: true
    - id: cash-machine
      question_en: Still no QR?
      advice_en: Use the station ticket machine. English button → destination → cash. Token in, token out. Do not friend-bind a ride code.
      never:
        - friend_bind
      next: null
      vpn_off_only: false
