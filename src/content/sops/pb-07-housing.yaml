id: pb-07
title_en: Housing lease, 网签, and 58 traps
status: draft
version: 1
last_verified: null
source_max_age_days: 30
lifecycle: first_week
public_slug: housing-lease
summary_en: Treat 58 as a fake-listing trap. Tenant commission figures conflict — mark unknown. File 网签. Copy ordinance fields for the PB-02 lodging form. Never a fake 居住证明.
disclaimer_en: This is a procedure guide, not legal, medical, or immigration advice.
attach_when:
  - when: broken_contains
    value: housing_lease
  - when: flag_is
    value: housing_lease
primary_cta:
  id: next_step
  label_en: Continue
official_urls:
  - label: Shenzhen housing-lease ordinance (2025-09-15)
    url: https://www.sz.gov.cn/ztfw/zfly/wyk_184880/content/post_12341639.html
    kind: official
  - label: sz.gov.cn English — housing-rental supervision platform
    url: http://www.sz.gov.cn/en_szgov/services/personal/accommodation/platform/
    kind: official
  - label: HiShenzhen — renting as a foreigner (指南, 非法律)
    url: https://hishenzhen.com/renting-apartment-shenzhen-foreigner-guide/
    kind: guide
  - label: Wellcee Shenzhen — English listings
    url: https://www.wellcee.com/shenzhen/m/rent-apartment
    kind: guide
  - label: HeyShenzhen (指南, 非法律)
    url: https://heyshenzhen.com/
    kind: guide
conflicts:
  - id: commission-half-vs-month
    title_en: Tenant commission — half month vs one month
    resolution: verify_at_window
    sources:
      - label: HiShenzhen — renting as a foreigner
        url: https://hishenzhen.com/renting-apartment-shenzhen-foreigner-guide/
        kind: guide
        claim_en: HiShenzhen describes tenant-side Beike / Lianjia commission as about half a month's rent. That is a guide figure, not a published official fee schedule.
        as_of: "2026-01"
      - label: HeyShenzhen
        url: https://heyshenzhen.com/
        kind: guide
        claim_en: Another English guide cluster describes tenant commission as about one month. The two figures conflict. Mark unknown. Verify on the agency invoice the day you sign. We do not pick a winner.
        as_of: "2026-01"
      - label: Shenzhen housing-lease ordinance
        url: https://www.sz.gov.cn/ztfw/zfly/wyk_184880/content/post_12341639.html
        kind: official
        claim_en: The 2025-09-15 ordinance requires a real-name contract and points at the city supervision platform. It does not settle tenant commission as a published half-month or one-month rule.
        as_of: "2025-09-15"
  - id: fifty-eight-trap
    title_en: 58 as a listing trap, not a channel
    resolution: verify_at_window
    sources:
      - label: HiShenzhen — renting as a foreigner
        url: https://hishenzhen.com/renting-apartment-shenzhen-foreigner-guide/
        kind: guide
        claim_en: HiShenzhen explicitly advises against 58 as a primary channel. Treat 58 as a fake-listing trap. Prefer Beike / Lianjia inventory or a smaller English board such as Wellcee.
        as_of: "2026-01"
      - label: Wellcee Shenzhen
        url: https://www.wellcee.com/shenzhen/m/rent-apartment
        kind: guide
        claim_en: Wellcee is an English board with small inventory. It is not a city marketplace we operate, and it is not a promise the flat is still free.
        as_of: "2026-01"
failure_tree:
  fifty-eight-too-good:
    prompt_en: A 58 listing is far cheaper than Beike / Wellcee for the same building?
    options:
      - label_en: Yes — treat 58 as a trap
        next: no-wangqian
        never:
          - fifty_eight_wire
          - wechat_deposit
        advice_en: Treat it as a trap. Do not wire a deposit to a personal WeChat. Walk the building with a licensed agent or skip the listing. HiShenzhen tells foreigners not to use 58 as the channel.
        vpn_off_only: false
      - label_en: I did not use 58
        next: no-wangqian
        never:
          - wechat_deposit
        advice_en: Still never wire a deposit to a personal WeChat.
        vpn_off_only: false
  no-wangqian:
    prompt_en: The landlord or agent says skip 网签 / the city platform?
    options:
      - label_en: Yes — they want to skip filing
        next: asked-fake-juzhu
        never:
          - skip_wangqian
          - fake_residence
        advice_en: The 2025-09-15 ordinance and the city platform exist so the lease is on record. Unfiled leases can block later residence steps. Do not skip 网签 to “save commission.”
        vpn_off_only: false
      - label_en: They will file 网签
        next: asked-fake-juzhu
        never:
          - fake_residence
        advice_en: Confirm the receipt, not a WeChat screenshot.
        vpn_off_only: false
  asked-fake-juzhu:
    prompt_en: Someone offers a printed 居住证明 or a chop you did not earn at the window?
    options:
      - label_en: Yes — refuse the fake slip
        next: null
        never:
          - fake_residence
          - fake_chop
        advice_en: Refuse. A fake slip is worse than a late one. Run pb-02 for a real 住宿登记. This copilot never produces a fake 居住证明.
        vpn_off_only: false
      - label_en: No one offered a fake slip
        next: null
        never:
          - fake_residence
        advice_en: Keep it real. If you still need to register, run pb-02.
        vpn_off_only: false
attached_playbooks:
  - pb-02
steps:
