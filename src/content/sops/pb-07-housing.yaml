failure_tree:
  id: pb-07-stuck
  title_en: I'm stuck
  nodes:
  - id: fake_listing
    question_en: Listing looks fake / seller pushes off-platform payment?
    advice_en: Stop. Do not wire a deposit. Switch channel (Wellcee / Beike / known agent).
    never:
    - pay_a_unlock_fee_to_see_the_flat_
    next: landlord_refuses
    vpn_off_only: false
  - id: landlord_refuses
    question_en: Landlord will not rent to a foreign passport?
    advice_en: Walk away and keep searching — do not use a local friend as a fake tenant.
    never:
    - have_a_chinese_friend_sign_as_the_tenant_while_i
    next: contract_mismatch
    vpn_off_only: false
  - id: contract_mismatch
    question_en: Name/ID on lease does not match passport?
    advice_en: Fix the draft before signing. Prefill from passport spelling.
    never: []
    next: wangqian_fail
    vpn_off_only: false
  - id: wangqian_fail
    question_en: 网签 platform rejects passport login or agent stalls?
    advice_en: Ask agent/landlord to file on their account and give you the receipt.
    never:
    - skip_and_forge_a_stay_letter_for_hr_
    next: null
    vpn_off_only: false
