    title_en: Treat 58 as a trap
    slot: required_check
    why: HiShenzhen tells foreigners not to use 58 as the channel. A too-cheap listing is the usual bait. We do not run a marketplace.
    skippable: false
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
    speech_card: null
    click_path: null
    official_urls:
      - label: HiShenzhen — renting as a foreigner
        url: https://hishenzhen.com/renting-apartment-shenzhen-foreigner-guide/
        kind: guide
    prefill: {}
    required_checkboxes:
      - id: no-58
        label_en: I will not use 58 as my listing channel
      - id: no-wechat-deposit
        label_en: I will not wire a deposit to a personal WeChat
    primary_cta:
      id: next_step
      label_en: Continue
    stuck_node: fifty-eight-too-good
    timer: null
  - id: commission-conflict
    title_en: Commission — half month vs one month
    slot: conflict
    why: HiShenzhen writes about half a month. Another English guide cluster writes one month. The ordinance does not settle the number. Mark unknown. Verify on the invoice.
    skippable: false
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
    speech_card: null
    click_path: null
    official_urls:
      - label: HiShenzhen — renting as a foreigner
        url: https://hishenzhen.com/renting-apartment-shenzhen-foreigner-guide/
        kind: guide
      - label: HeyShenzhen
        url: https://heyshenzhen.com/
        kind: guide
      - label: Shenzhen housing-lease ordinance
        url: https://www.sz.gov.cn/ztfw/zfly/wyk_184880/content/post_12341639.html
        kind: official
    prefill: {}
    required_checkboxes: []
    primary_cta:
      id: next_step
      label_en: I will verify the invoice
    stuck_node: no-wangqian
    timer: null
  - id: channels
    title_en: Channels — English small, Beike large, 58 out
    slot: click_path
    why: Wellcee is English with small stock. Beike / Lianjia has the inventory (tenant commission unknown). Anjuke is mixed. 58 stays a trap. We do not invent a street or a “guaranteed foreigner building.”
    skippable: false
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
    speech_card: null
    click_path:
      steps:
        - n: 1
          text_en: If you need English first, open Wellcee. Expect thin inventory. Confirm the flat is still free with the agent named on the card.
          screenshot: null
        - n: 2
          text_en: For stock, use Beike / Lianjia. Ask whether the building accepts a foreign passport before you travel. We do not invent that list.
          screenshot: null
        - n: 3
          text_en: Do not start on 58. Do not pay a personal WeChat to “hold” a key.
          screenshot: null
    official_urls:
      - label: Wellcee Shenzhen
        url: https://www.wellcee.com/shenzhen/m/rent-apartment
        kind: guide
      - label: HiShenzhen — renting as a foreigner
        url: https://hishenzhen.com/renting-apartment-shenzhen-foreigner-guide/
        kind: guide
    prefill: {}
    required_checkboxes: []
    primary_cta:
      id: open_official
      label_en: Open Wellcee or the guide
    stuck_node: fifty-eight-too-good
    timer: null
  - id: wangqian
    title_en: 网签 on the city platform
    slot: click_path
    why: 2025-09-15 ordinance — real-name contract. City platform filing is commonly 1–3 working days. The UI is Chinese. An unfiled lease can block later residence steps.
    skippable: false
    skip_if: null
    passport_fail_warning:
      title_en: Passport before any agent QR
      body_en: Real-name 网签 needs your passport. Do not let an agent photograph it “to file for you” on a personal phone and then skip the platform.
    getting_there: null
    what_to_bring:
      - id: passport
        label_en: Passport
        required: true
      - id: contract
        label_en: Bilingual or Chinese lease draft
        required: true
    speech_card: null
    click_path:
      steps:
        - n: 1
          text_en: Open the city English platform page in official_urls. The filing UI itself is Chinese — use the speech card with the agent.
          screenshot: null
        - n: 2
          text_en: Ask the agent to complete 网签 / 住房租赁监管服务平台备案. Guides say 1–3 working days. Confirm the receipt, not a WeChat screenshot.
          screenshot: null
    official_urls:
      - label: sz.gov.cn English — housing-rental supervision platform
        url: http://www.sz.gov.cn/en_szgov/services/personal/accommodation/platform/
        kind: official
      - label: Shenzhen housing-lease ordinance
        url: https://www.sz.gov.cn/ztfw/zfly/wyk_184880/content/post_12341639.html
        kind: official
    prefill: {}
    required_checkboxes: []
    primary_cta:
      id: open_official
      label_en: Open the platform page
    stuck_node: no-wangqian
    timer: null
  - id: ordinance-fields-for-pb02
    title_en: Copy ordinance fields for PB-02 — do not invent an address
    slot: click_path
    why: The lodging form wants the door 房屋码 and the address as filed, not a street you type from memory. These fields feed pb-02. We never submit.
    skippable: false
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring:
      - id: house-code
        label_en: Door 房屋码 (photo or access)
        required: true
      - id: filed-address
        label_en: Address as written on the 网签 / lease
        required: true
      - id: landlord
        label_en: Landlord name and phone as on the contract
        required: false
      - id: start-date
        label_en: Move-in date
        required: true
    speech_card:
      hanzi: 请问房屋码在哪里？我要按合同地址办理住宿登记，请不要让我手打地址。
      pinyin: Qǐngwèn fángwū mǎ zài nǎlǐ? Wǒ yào àn hétong dìzhǐ bànlǐ zhùsù dēngjì, qǐng bú yào ràng wǒ shǒu dǎ dìzhǐ.
      en: Where is the house QR? I will register the stay using the contract address. Please do not ask me to type the street.
    click_path:
      steps:
        - n: 1
          text_en: Copy 房屋码, filed address, landlord name/phone, and move-in date from the contract or 网签 receipt. Do not retype a street from memory.
          screenshot: null
        - n: 2
          text_en: Open pb-02. Scan the door QR. We never submit the police form. Never invent a 居住证明.
          screenshot: null
    official_urls: []
    prefill:
      pb02_fields:
        - house_qr
        - filed_address
        - landlord_name_phone
        - move_in_date
      attach: pb-02
    required_checkboxes: []
    primary_cta:
      id: next_step
      label_en: I copied the fields
    stuck_node: asked-fake-juzhu
    timer: null
  - id: never-fake-juzhu
    title_en: Never produce a fake residence slip
    slot: required_check
    why: A forged 居住证明 or 住宿登记 is worse than a late real one. If you still need to register, run pb-02.
    skippable: false
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
    speech_card: null
    click_path: null
    official_urls: []
    prefill: {}
    required_checkboxes:
      - id: no-fake-slip
        label_en: I will not use or request a fake 居住证明 / 住宿登记
      - id: run-pb02
        label_en: If I still need to register, I will run the accommodation playbook
    primary_cta:
      id: next_step
      label_en: Continue
    stuck_node: asked-fake-juzhu
    timer: null
  - id: short-stay-pets
    title_en: Short stay and pet clauses — ask, do not invent
    slot: speech
    why: Guides say many landlords will not take a 4-month stay. A shepherd / large-dog clause is a contract line, not a city ban we invent. Ask in Chinese. Do not promise the building “accepts foreigners.”
    skippable: true
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
    speech_card:
      hanzi: 请问最短租期是多久？合同能否网签？是否接受外籍租客和宠物？
      pinyin: Qǐngwèn zuì duǎn zūqī shì duō jiǔ? Hétong néng fǒu wǎngqiān? Shìfǒu jiēshòu wàijí zūkè hé chǒngwù?
      en: What is the minimum term? Can we file 网签? Do you accept a foreign tenant, and pets?
    click_path: null
    official_urls: []
    prefill: {}
    required_checkboxes: []
    primary_cta:
      id: next_step
      label_en: Show agent
    stuck_node: no-wangqian
    timer: null
