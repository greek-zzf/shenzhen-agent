    title_en: Hours conflict — 6:30–24:00 vs a 17:00 field report
    slot: conflict
    why: We show both claims. We never pick a winner. Verify on the board.
    skippable: false
    skip_if: null
    passport_fail_warning: null
    getting_there: null
    what_to_bring: []
