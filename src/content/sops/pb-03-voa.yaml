id: pb-03
title_en: 5-day visa on arrival
status: draft
last_verified: null
source_max_age_days: 14
lifecycle: 72h
public_slug: voa-hours
summary_en: Check the NIA list on the i口岸 English page. Do not treat posted hours as current. Luohu visa office. No approval promise.
disclaimer_en: This is a procedure guide, not legal, medical, or immigration advice.
attach_when:
  - when: visa_type_in
    value: VOA
  - when: location_is
    value: hk_no_visa
primary_cta:
  id: open_official
  label_en: Open the NIA list
official_urls:
  - label: i口岸 English — NIA visa services (do not hardcode countries)
    url: https://www.szpsq.gov.cn/English/SERVICES/Checkpoints/content/post_11674450.html
    kind: official
  - label: Pingshan English — major port visa offices / FAQs
    url: https://www.szpsq.gov.cn/English/SERVICES/Checkpoints/index.html
    kind: official
conflicts:
  - id: voa-hours
    title_en: Published hours vs a 2025-11 field report — we do not pick a winner
    resolution: verify_at_window
    sources:
      - label: Published port-hours range (6:30–24:00 appears in older port copy)
        url: https://www.szpsq.gov.cn/English/SERVICES/Checkpoints/index.html
        kind: official
        claim_en: Some public pages describe long port operating windows (including a 6:30–24:00 range). This playbook does not treat those numbers as today's visa-office hours.
        as_of: "2024-07"
      - label: r/shenzhen 1ptwzwe field report
        url: https://www.reddit.com/r/shenzhen/comments/1ptwzwe/
        kind: user_report
        claim_en: A November 2025 field report described the visa window closing around 17:00. That is one traveler's note, not a timetable. Verify on the board the day you go.
        as_of: "2025-11"
  - id: west-kowloon-outbound
    title_en: West Kowloon outbound VOA — field report only
    resolution: verify_at_window
    sources:
      - label: r/shenzhen 1ptwzwe
        url: https://www.reddit.com/r/shenzhen/comments/1ptwzwe/
        kind: user_report
        claim_en: A November 2025 report described outbound visa-on-arrival handling at West Kowloon. Treat it as a field note from 2025-11, not a current service fact.
        as_of: "2025-11"
      - label: i口岸 English — official visa pointer
        url: https://www.szpsq.gov.cn/English/SERVICES/Checkpoints/content/post_11674450.html
        kind: official
        claim_en: Official copy points you to the National Immigration Administration bilingual platform for visa categories. Use that list. Do not rely on a Reddit itinerary.
        as_of: "2024-12"
failure_tree:
  id: voa-stuck
  title_en: I'm stuck
  nodes:
    - id: not-on-list
      question_en: Your passport is not on the live NIA list?
      advice_en: Stop. Do not buy a story about a workaround. Read the i口岸 English page and the NIA list it links. This playbook will not invent eligibility.
      never:
        - fake_eligibility
      next: hours-unknown
      vpn_off_only: false
    - id: hours-unknown
      question_en: The door is closed or the queue is gone?
      advice_en: Do not trust a screenshot of hours. Ask the board / the officer. We will not tell you they are open until 24:00 or until 17:00.
      never:
        - assert_hours
      next: vpn-off
      vpn_off_only: false
    - id: vpn-off
      question_en: The i口岸 or NIA page will not load?
      advice_en: Turn the VPN off and retry. That is the only network step.
      never: []
      next: null
      vpn_off_only: true
attached_playbooks: []
steps:
  - id: nia-list
    title_en: Check the live NIA list — do not hardcode countries
    slot: click_path
    why: Eligibility changes. This SOP will not list nationalities. Open the official English pointer and follow it to the NIA list.
    skippable: false
    skip_if: null
    passport_fail_warning:
      title_en: Passport first — before any mini-program
      body_en: Bring the physical passport. Screenshot the NIA list for your nationality the same day. If you are not on the list, do not queue for a story.
    getting_there: null
    what_to_bring:
      - id: passport
        label_en: Passport
        required: true
      - id: photo
        label_en: Visa photo if you already have one
        required: false
    speech_card: null
    click_path:
      steps:
        - n: 1
          text_en: Open the i口岸 English page (official_urls). Use it to reach the National Immigration Administration bilingual list.
          screenshot: null
        - n: 2
          text_en: Confirm your nationality on that live list. We do not store a country table in this playbook.
          screenshot: null
        - n: 3
          text_en: If you are not listed, stop. This is not an approval path.
          screenshot: null
    official_urls:
      - label: i口岸 English page
        url: https://www.szpsq.gov.cn/English/SERVICES/Checkpoints/content/post_11674450.html
        kind: official
    prefill: {}
    required_checkboxes: []
    primary_cta:
      id: open_official
      label_en: Open the NIA list
    stuck_node: not-on-list
    timer: null
