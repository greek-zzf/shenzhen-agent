    title_en: Airport one-stop can help SIM — not a hall SLA
    slot: getting_there
    why: T3 one-stop sells tourist SIMs when stocked. It does not replace a city-hall real-name number.
    skippable: true
    skip_if:
      field: location
      equals: already_in_city
    passport_fail_warning: null
    getting_there:
      poi_en: Bao'an Airport T3 international-arrivals one-stop desk
