id: pb-06
title_en: Open a mainland bank account
status: draft
version: 1
last_verified: null
source_max_age_days: 30
lifecycle: first_week
public_slug: bank
summary_en: Predict a tourist or L-visa refuse before you queue. Pack passport, visa or residence, lodging registration, and a mainland number. Guide names areas, not invented streets. Airport one-stop is not a bank SLA. Never a proxy account or underground FX.
disclaimer_en: This is a procedure guide, not legal, medical, or immigration advice.
attach_when:
  - when: broken_contains
    value: need_bank
  - when: flag_is
    value: need_bank
primary_cta:
  id: i_have_these
  label_en: I have these
official_urls:
  - label: HiShenzhen — open a bank account (指南, 非法律)
    url: https://hishenzhen.com/how-to-open-bank-account-shenzhen/
    kind: guide
  - label: HeyShenzhen — bank account (指南, 非法律)
    url: https://heyshenzhen.com/bank-account
    kind: guide
  - label: SZNews — airport one-stop (payment help, not a bank SLA)
    url: https://www.sznews.com/news/content/mb/2025-01/25/content_31448742.htm
    kind: official
  - label: Pingshan English — airport and Bay one-stop centers
    url: https://www.szpsq.gov.cn/English/SERVICES/Checkpoints/content/post_12325911.html
    kind: official
conflicts:
  - id: visa-open-predict
    title_en: Tourist / L / VOA opening is usually refused — not a promise either way
    resolution: verify_at_window
    sources:
      - label: HiShenzhen — open a bank account
        url: https://hishenzhen.com/how-to-open-bank-account-shenzhen/
        kind: guide
        claim_en: English guides say Z / X / residence holders are the usual successful openers. An L or tourist visa is commonly refused at the window. That is a field pattern, not a statute and not a promise a work visa always works.
        as_of: "2026-01"
      - label: HeyShenzhen — bank account
        url: https://heyshenzhen.com/bank-account
        kind: guide
        claim_en: Guides describe in-person opening with passport, visa or residence, lodging registration, and a mainland number. They do not authorize a tourist workaround, a friend account, or a street changer.
        as_of: "2026-01"
  - id: airport-onestop-not-bank-sla
    title_en: Airport one-stop vs same-day opening — not an SLA
    resolution: verify_at_window
    sources:
      - label: SZNews 2025-01-25 one-stop opening
        url: https://www.sznews.com/news/content/mb/2025-01/25/content_31448742.htm
        kind: official
        claim_en: Official copy frames T3 and Shenzhen Bay one-stop desks as payment, SIM, transport-card, and immigration help. They are not a bank-account counter and do not quote an opening SLA.
        as_of: "2025-01-25"
      - label: HeyShenzhen — bank account
        url: https://heyshenzhen.com/bank-account
        kind: guide
        claim_en: The guide describes China Merchants / ICBC help at the airport desk. That is a guide claim, not an official same-day opening promise. Sit both claims side by side. Verify at the desk.
        as_of: "2026-01"
      - label: Pingshan English one-stop locations
        url: https://www.szpsq.gov.cn/English/SERVICES/Checkpoints/content/post_12325911.html
        kind: official
        claim_en: Airport desk is described as Level 1, Terminal 3, next to the international arrivals exit. Use it for wallet setup help. Do not treat it as a promised bank appointment.
        as_of: "2026-09-04"
failure_tree:
  id: bank-stuck
  title_en: I'm stuck
  nodes:
    - id: visa-refused
      question_en: The clerk refused because your visa is L, tourist, or VOA?
      advice_en: That is the usual window outcome for a short-stay visa. Do not hire a proxy opener or change cash on the street. Finish payments with PB-01 wallets and cash. Come back with a work / residence document if you later have one.
      never:
        - proxy_account
        - underground_fx
      next: branch-refuses
      vpn_off_only: false
    - id: branch-refuses
      question_en: This branch says they do not open foreign-passport accounts?
      advice_en: Neighborhood windows often refuse. Try another window in a guide-named area (Futian Coco Park, Shekou, Hi-Tech) — follow the page you opened, do not invent a street. Never a yellow-cow or proxy opener.
      never:
        - proxy_account
        - invent_street
      next: airport-not-sla
      vpn_off_only: false
    - id: airport-not-sla
      question_en: Airport one-stop will not open an account today?
      advice_en: Official copy is payment and SIM help, not a bank SLA. The HeyShenzhen same-day claim is a guide, not a promise. Ask what they can actually do today. Do not treat the desk as a quoted opening time.
      never:
        - treat_as_sla
        - proxy_account
      next: asked-for-agent
      vpn_off_only: false
    - id: asked-for-agent
      question_en: Someone offers to open the account for you, or to change a large amount off the books?
      advice_en: Walk away. Opening must be you, in person, at a licensed counter. This copilot never assists a proxy account or underground FX.
      never:
        - proxy_account
        - underground_fx
      next: null
      vpn_off_only: false
