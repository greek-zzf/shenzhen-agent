id: pb-06
title_en: Open a mainland bank account — materials and branch pick
status: draft
version: 1
last_verified: null
source_max_age_days: 30
lifecycle: first_week
public_slug: null
summary_en: Predict L-visa refuse risk first. Bring passport, visa/residence, 住宿登记, and a mainland number.
  Guide-consensus areas only — no invented street numbers. Never proxy open or underground remittance.
disclaimer_en: This is a procedure guide, not legal, medical, or immigration advice.
attach_when:
- when: broken_contains
  value: bank
primary_cta:
  id: i_have_these
  label_en: I have these
official_urls:
- label: HiShenzhen — open a bank account (指南, 非法律)
  url: https://hishenzhen.com/how-to-open-bank-account-shenzhen/
  kind: guide
- label: HeyShenzhen bank account (指南, 非法律)
  url: https://heyshenzhen.com/bank-account
  kind: guide
- label: Official English — one-stop services
  url: https://www.szpsq.gov.cn/English/SERVICES/Checkpoints/content/post_12325911.html
  kind: official
conflicts:
- id: c-airport-open-account-sla
  title_en: 'Airport T3 / Shenzhen Bay one-stop: official copy stresses payment / SIM / transit help.
    Some guides write on-the-spot CMB/ICBC opening. Do not treat airport account opening as an SLA.'
  resolution: verify_at_window
  sources:
  - label: szpsq English — airport / Shenzhen Bay one-stop
    url: https://www.szpsq.gov.cn/English/SERVICES/Checkpoints/content/post_12325911.html
    kind: official
    claim_en: Assists Weixin Pay / Alipay, SIM, transit cards, bilingual guides. No equal-weight promise
      of an instant personal bank account.
    as_of: '2026-09-04'
  - label: HeyShenzhen bank (指南, 非法律)
    url: https://heyshenzhen.com/bank-account
    kind: guide
    claim_en: Guide describes on-the-spot CMB/ICBC account opening at airport-style service points. Product
      must not treat that as an SLA.
    as_of: guide
- id: c-friendly-branches-are-guides
  title_en: Futian Coco Park / Shekou / Hi-Tech as 'foreigner-friendlier' is guide consensus, not an official
    ranking. Residential tiny branches often refuse passports.
  resolution: verify_at_window
  sources:
  - label: HiShenzhen open bank account (指南, 非法律)
    url: https://hishenzhen.com/how-to-open-bank-account-shenzhen/
    kind: guide
    claim_en: Guides steer foreigners toward larger / expat-visible branches and away from small residential
      outlets. No official city ranking.
    as_of: 2026-guide
  - label: HeyShenzhen bank (指南, 非法律)
    url: https://heyshenzhen.com/bank-account
    kind: guide
    claim_en: Same area folklore (Coco Park / Shekou / Hi-Tech). Confirm at the branch; do not invent
      street numbers.
    as_of: guide
failure_tree:
  id: pb-06-stuck
  title_en: I'm stuck
  nodes:
  - id: visa_refused
    question_en: Branch said your visa type cannot open a personal account?
    advice_en: Ask what document would make it possible (residence permit, work permit). Use foreign-card
      Alipay/WeChat for spend while you wait (PB-01).
    never:
    - borrow_a_friend_s_mainland_account_
    next: missing_materials
    vpn_off_only: false
  - id: missing_materials
    question_en: Missing stay slip or mainland number?
    advice_en: Finish accommodation registration (PB-02). Get a mainland SIM (PB-04).
    never: []
    next: branch_refused
    vpn_off_only: false
  - id: branch_refused
    question_en: This branch will not handle foreign passports today?
    advice_en: Try another larger branch in Futian / Shekou / Hi-Tech — call first.
    never:
    - pay_someone_to_open_an_account_under_their_name_
    next: form_language
    vpn_off_only: false
  - id: form_language
    question_en: Form is Chinese-only and staff English is limited?
    advice_en: Show the speech card and point at passport fields one by one.
    never: []
    next: app_bind_fail
    vpn_off_only: false
  - id: app_bind_fail
    question_en: Bank app will not bind the new card?
    advice_en: Return to the same counter with the phone and ask them to reset SMS / app KYC.
    never: []
    next: null
    vpn_off_only: false
attached_playbooks:
- pb-02
